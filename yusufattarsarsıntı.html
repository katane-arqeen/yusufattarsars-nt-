<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusuf Attar Sarsıntı - Canlı Deprem Takip</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Neon ve Koyu Tema Renk Paleti */
        :root {
            --bg-main: #050505;
            --bg-card: rgba(15, 15, 20, 0.85);
            --neon-cyan: #00f3ff;
            --neon-cyan-glow: rgba(0, 243, 255, 0.5);
            --neon-red: #ff003c;
            --neon-red-glow: rgba(255, 0, 60, 0.5);
            --text-main: #e0e6ed;
            --text-muted: #8b949e;
            --border-color: rgba(0, 243, 255, 0.2);
            --glass-blur: blur(10px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) var(--bg-main);
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #111a22 0%, #050505 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Özel Kaydırma Çubuğu */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }

        /* Header Tasarımı */
        header {
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: var(--glass-blur);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background-color: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red);
            animation: pulseRed 1.5s infinite;
        }

        .brand span {
            color: var(--text-main);
            font-weight: 500;
            font-size: 1.1rem;
            text-shadow: none;
            letter-spacing: 1px;
        }

        /* Instagram Butonu */
        .owner-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(220, 39, 67, 0.5);
            margin-top: 5px;
        }

        .owner-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(220, 39, 67, 0.8);
        }

        .owner-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .last-updated {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan-glow);
        }

        button.glow-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px inset var(--neon-cyan-glow), 0 0 10px var(--neon-cyan-glow);
        }

        button.glow-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
        }

        /* Ana İçerik Konteyneri */
        .container {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Kontroller */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .controls input, .controls select {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--neon-cyan);
            padding: 0.7rem 1rem;
            border-radius: 6px;
            outline: none;
            flex: 1;
            min-width: 150px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .controls input::placeholder { color: var(--text-muted); }
        .controls input:focus, .controls select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan-glow);
        }

        /* Tablo */
        .table-container {
            flex: 1;
            overflow-y: auto;
            max-height: 60vh;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }

        th {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
        }

        tr { transition: all 0.2s ease; cursor: pointer; }
        
        tr:hover {
            background-color: rgba(0, 243, 255, 0.1);
            box-shadow: inset 4px 0 0 var(--neon-cyan);
        }

        /* Işıklı Büyüklük Rozetleri (Badges) */
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace;
            display: inline-block;
        }

        .mag-normal {
            background-color: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan-glow);
        }

        .mag-danger {
            background-color: rgba(255, 0, 60, 0.1);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            box-shadow: 0 0 10px var(--neon-red-glow), inset 0 0 5px var(--neon-red-glow);
            animation: textPulseRed 1.5s infinite;
        }

        .row-danger {
            background-color: rgba(255, 0, 60, 0.05);
        }
        .row-danger:hover {
            background-color: rgba(255, 0, 60, 0.15);
            box-shadow: inset 4px 0 0 var(--neon-red);
        }

        /* Harita */
        #map {
            width: 100%;
            height: 100%;
            min-height: 60vh;
            border-radius: 8px;
            z-index: 1;
            filter: contrast(1.2) saturate(1.2);
        }

        /* Harita Işıklı Noktalar (Glow Markers) */
        .glow-marker {
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            animation: pulseCyan 2s infinite;
        }

        .glow-marker-danger {
            background: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red), 0 0 30px var(--neon-red);
            animation: pulseRed 1s infinite;
        }

        /* Yükleniyor Ekranı */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(5, 5, 5, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            border-radius: 12px;
        }

        .loader-overlay.active { opacity: 1; pointer-events: all; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 243, 255, 0.2);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px var(--neon-cyan-glow);
            margin-bottom: 1rem;
        }

        /* Animasyonlar */
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @keyframes pulseCyan {
            0% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 10px var(--neon-cyan); }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
            100% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 10px var(--neon-cyan); }
        }

        @keyframes pulseRed {
            0% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 10px var(--neon-red); }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 20px var(--neon-red), 0 0 40px var(--neon-red); }
            100% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 10px var(--neon-red); }
        }

        @keyframes textPulseRed {
            0% { text-shadow: 0 0 5px var(--neon-red); }
            50% { text-shadow: 0 0 15px var(--neon-red), 0 0 20px var(--neon-red); }
            100% { text-shadow: 0 0 5px var(--neon-red); }
        }

        /* Leaflet Popup Koyu Tema Tasarımı */
        .leaflet-popup-content-wrapper {
            background: rgba(10, 10, 15, 0.95);
            color: #fff;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan-glow);
            border-radius: 8px;
        }
        .leaflet-popup-tip {
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid var(--neon-cyan);
        }

        /* Mobil Uyum (Responsive) */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
            #map { min-height: 400px; }
            .table-container { max-height: 400px; }
        }

        @media (max-width: 600px) {
            header { flex-direction: column; text-align: center; justify-content: center; }
            .brand h1 { font-size: 1.4rem; justify-content: center; }
            .header-controls { flex-direction: column; gap: 1rem; width: 100%; }
            .controls { flex-direction: column; }
            .container { padding: 1rem; }
            th, td { padding: 0.75rem 0.5rem; font-size: 0.95rem; }
            button.glow-btn { width: 100%; }
            .owner-link { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="brand">
                <div class="live-dot"></div>
                <h1>Yusuf Attar Sarsıntı</h1>
            </div>
            <div class="brand" style="margin-top: 4px;">
                <span>Canlı Deprem Takip Sistemi</span>
            </div>
            <!-- Instagram Bağlantısı -->
            <a href="https://www.instagram.com/yusuf_attar22?igsh=c3JmOG12NDJncnBq" target="_blank" class="owner-link">
                <svg viewBox="0 0 448 512"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>
                Site Sahibi: Yusuf Attar
            </a>
        </div>
        <div class="header-controls">
            <span class="last-updated" id="lastUpdated">SYNC_STATUS: BAĞLANILIYOR...</span>
            <button class="glow-btn" onclick="fetchEarthquakes()">Veriyi Yenile</button>
        </div>
    </header>

    <div class="container">
        <!-- Liste ve Kontroller -->
        <div class="card">
            <div class="loader-overlay" id="loader">
                <div class="spinner"></div>
                <p style="color: var(--neon-cyan); font-family: 'Roboto Mono', monospace; letter-spacing: 2px;">SİSTEM AĞA BAĞLANIYOR...</p>
            </div>
            
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Bölge / Konum Ara...">
                <select id="magFilter">
                    <option value="0">TÜM ŞİDDETLER</option>
                    <option value="3.0">3.0 VE ÜZERİ</option>
                    <option value="4.0">4.0 VE ÜZERİ</option>
                    <option value="4.5">4.5 VE ÜZERİ (KRİTİK)</option>
                    <option value="5.5">5.5 VE ÜZERİ (TEHLİKE)</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Konum</th>
                            <th>Şiddet</th>
                            <th>Zaman</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Veriler Buraya Gelecek -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Harita Alanı -->
        <div class="card" style="padding: 0.5rem;">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_URL = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&orderby=time&limit=30';
        let allEarthquakes =[];
        let map;
        let markersLayer;

        // Haritayı Başlat (Koyu Siberpunk Temalı Katman)
        function initMap() {
            map = L.map('map').setView([39.0, 35.0], 2);
            
            // CartoDB Dark Matter (Koyu tema harita)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://carto.com/">CartoDB</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }

        // API'den Veri Çek
        async function fetchEarthquakes() {
            const loader = document.getElementById('loader');
            loader.classList.add('active');

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Ağ hatası");
                const data = await response.json();
                
                allEarthquakes = data.features;
                updateLastUpdateTime();
                renderData();
            } catch (error) {
                console.error('Hata:', error);
                document.getElementById('lastUpdated').innerText = "SİSTEM HATASI: BAĞLANTI YOK";
                document.getElementById('lastUpdated').style.color = "var(--neon-red)";
            } finally {
                loader.classList.remove('active');
            }
        }

        // Tarih Formatlayıcı
        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('tr-TR', { 
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute:'2-digit', second:'2-digit'
            });
        }

        function updateLastUpdateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('tr-TR');
            const el = document.getElementById('lastUpdated');
            el.innerText = `SYNC_STATUS: GÜNCEL [${timeStr}]`;
            el.style.color = "var(--neon-cyan)";
        }

        // Tabloyu ve Haritayı Ekrana Çiz
        function renderData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            markersLayer.clearLayers();

            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const minMag = parseFloat(document.getElementById('magFilter').value);

            const filteredData = allEarthquakes.filter(eq => {
                const place = (eq.properties.place || "").toLowerCase();
                const mag = eq.properties.mag || 0;
                return place.includes(searchText) && mag >= minMag;
            });

            if (filteredData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 2rem; color: var(--text-muted);">SİSTEMDE EŞLEŞEN KAYIT BULUNAMADI.</td></tr>`;
                return;
            }

            filteredData.forEach((eq, index) => {
                const props = eq.properties;
                const coords = eq.geometry.coordinates; 
                const lat = coords[1];
                const lng = coords[0];
                
                const place = props.place || "Bilinmeyen Konum";
                const mag = props.mag ? props.mag.toFixed(1) : "N/A";
                const time = formatDateTime(props.time);
                
                // 4.5 ve üzeri tehlikeli kabul ediliyor
                const isDanger = props.mag >= 4.5;

                /* --- TABLO SATIRI --- */
                const tr = document.createElement('tr');
                if (isDanger) tr.classList.add('row-danger');
                
                const textColor = isDanger ? 'var(--neon-red)' : 'var(--text-main)';
                const badgeClass = isDanger ? 'mag-danger' : 'mag-normal';
                
                tr.innerHTML = `
                    <td style="color: ${textColor};">${place}</td>
                    <td><span class="badge ${badgeClass}">${mag}</span></td>
                    <td style="font-family: 'Roboto Mono', monospace; font-size: 0.9rem; color: var(--text-muted);">${time}</td>
                `;

                // Tıklayınca Haritada Yakınlaşma Pürüzsüz Animasyonu
                tr.addEventListener('click', () => {
                    map.flyTo([lat, lng], 7, { animate: true, duration: 1.5 });
                });

                tableBody.appendChild(tr);

                /* --- HARİTA IŞIKLI NOKTALARI (CUSTOM HTML MARKER) --- */
                const markerSize = props.mag ? Math.max(props.mag * 4, 10) : 10;
                const glowClass = isDanger ? 'glow-marker-danger' : 'glow-marker';
                
                const customIcon = L.divIcon({
                    className: '', // Varsayılan stili temizle
                    html: `<div class="${glowClass}" style="width: ${markerSize}px; height: ${markerSize}px;"></div>`,
                    iconSize: [markerSize, markerSize],
                    iconAnchor:[markerSize/2, markerSize/2]
                });

                const marker = L.marker([lat, lng], { icon: customIcon });

                // Popup Tasarımı
                const popupColor = isDanger ? 'var(--neon-red)' : 'var(--neon-cyan)';
                marker.bindPopup(`
                    <div style="font-family: 'Rajdhani', sans-serif; text-align: center;">
                        <h3 style="margin: 0 0 5px 0; font-weight: 700; color: #fff;">${place}</h3>
                        <div style="font-size: 1.5rem; font-weight: 700; color: ${popupColor}; font-family: 'Roboto Mono', monospace; margin-bottom: 5px;">
                            ${mag}
                        </div>
                        <div style="font-size: 0.85rem; color: #aaa;">${time}</div>
                    </div>
                `);

                markersLayer.addLayer(marker);
            });
            
            // İlk yüklemede haritayı en yeni depreme odakla
            if(filteredData.length > 0 && map.getZoom() === 2) {
                const firstCoords = filteredData[0].geometry.coordinates;
                map.setView([firstCoords[1], firstCoords[0]], 3);
            }
        }

        // Olay Dinleyicileri (Arama ve Filtre)
        document.getElementById('searchInput').addEventListener('input', renderData);
        document.getElementById('magFilter').addEventListener('change', renderData);

        // Sayfa Yüklendiğinde
        document.addEventListener("DOMContentLoaded", () => {
            initMap();
            fetchEarthquakes();
            // Her 60 saniyede bir otomatik yenileme
            setInterval(fetchEarthquakes, 60000);
        });

    </script>
</body>
</html>
